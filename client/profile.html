<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="User profile - ⚡ ConnectHub" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Profile – ⚡ ConnectHub</title>
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <script src="js/config.js"></script>
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      window.requireAuth('Please login to continue');
    })();
  </script>
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/feed.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>
  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- ===== NAVIGATION ===== -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="feed.html" class="nav-logo" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="var(--primary)">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <line x1="9" y1="9" x2="9.01" y2="9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="15" y1="9" x2="15.01" y2="9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>ConnectHub</span>
    </a>
    
    <div class="nav-search" role="search">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search people..." 
        autocomplete="off"
        aria-label="Search users"
      />
      <div id="search-results" class="search-dropdown hidden" role="listbox"></div>
    </div>
    
    <div class="nav-actions">
      <!-- Feed -->
      <a href="feed.html" class="nav-icon-btn" title="Feed" aria-label="Feed">
        <i class="fa-solid fa-house"></i>
      </a>

      <!-- Clips -->
      <a href="clips.html" class="nav-icon-btn" title="ConnectClips ⚡" aria-label="ConnectClips ⚡">
        <i class="fa-solid fa-play"></i>
      </a>
      
      <!-- Explore -->
      <a href="explore.html" class="nav-icon-btn" title="Explore" aria-label="Explore">
        <i class="fa-solid fa-compass"></i>
      </a>
      
      <!-- Messages -->
      <a href="messages.html" class="nav-icon-btn" id="msg-link" title="Messages" aria-label="Messages" style="position:relative;">
        <i class="fa-solid fa-paper-plane"></i>
        <span class="msg-badge hidden" id="msg-badge"></span>
      </a>
      
      <!-- Bookmarks -->
      <a href="bookmarks.html" class="nav-icon-btn" title="Bookmarks" aria-label="Bookmarks">
        <i class="fa-solid fa-bookmark"></i>
      </a>
      
      <!-- Profile (active) -->
      <a href="profile.html" class="nav-icon-btn active" id="profile-link" title="Profile" aria-label="Profile">
        <i class="fa-solid fa-user"></i>
      </a>
      
      <!-- Notifications -->
      <button class="nav-icon-btn" id="notif-btn" title="Notifications" aria-label="Notifications" style="position:relative;">
        <i class="fa-solid fa-bell"></i>
        <span class="notif-badge hidden" id="notif-badge"></span>
      </button>
      
      <!-- Theme toggle -->
      <button class="nav-icon-btn theme-btn" id="theme-btn" title="Toggle dark mode" aria-label="Toggle theme">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
      
      <!-- Logout -->
      <button class="nav-icon-btn logout-btn" id="logout-btn" title="Logout" aria-label="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="container profile-container" id="main-content" role="main">
    <!-- Glassmorphic Profile Header Card -->
    <section class="card profile-header" id="profile-header">
      <div class="loading-spinner" style="text-align:center;padding:3rem;">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading profile...
      </div>
    </section>
    
    <!-- Analytics Panel -->
    <section class="card analytics-panel hidden" id="analytics-panel" aria-label="Profile analytics">
      <div class="analytics-header">
        <h3 class="section-title"><i class="fa-solid fa-chart-line"></i> Creator Analytics</h3>
        <button class="btn-close-sm" id="close-analytics-btn">&times;</button>
      </div>
      <div class="analytics-grid" id="analytics-grid"></div>
    </section>
    
    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-profile-title">
      <div class="modal-overlay"></div>
      <div class="modal-content" style="max-width:540px;">
        <div class="modal-header">
          <h3 id="edit-profile-title"><i class="fa-solid fa-user-pen" style="color:var(--primary);"></i> Edit Profile & Media</h3>
          <button class="modal-close" id="close-edit-modal" aria-label="Close modal">&times;</button>
        </div>
        <div class="modal-body" style="padding:1.5rem;">
          <form id="edit-profile-form-element" novalidate>
            <div class="form-group" style="margin-bottom:1rem;">
              <label for="edit-name" style="font-weight:700;">Full Name</label>
              <input type="text" id="edit-name" class="form-control" placeholder="Your name" required />
            </div>
            
            <div class="form-group" style="margin-bottom:1rem;">
              <label for="edit-bio" style="font-weight:700;">Bio</label>
              <textarea id="edit-bio" class="form-control" maxlength="200" rows="3" placeholder="Write a short bio..."></textarea>
              <small class="char-count"><span id="bio-count">0</span>/200</small>
            </div>
            
            <!-- Avatar Upload Section -->
            <div class="form-group" style="margin-bottom:1.25rem;">
              <label style="font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                <span><i class="fa-solid fa-user-circle" style="color:var(--primary);"></i> Profile Avatar</span>
                <span style="font-size:0.75rem;color:var(--text-muted);">PNG, JPG, WebP</span>
              </label>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <input type="url" id="edit-avatar" class="form-control" placeholder="Image URL or upload file below..." style="flex:1;min-width:180px;" />
                <button type="button" class="btn btn-outline btn-sm" id="trigger-avatar-upload" style="white-space:nowrap;font-weight:700;">
                  <i class="fa-solid fa-upload"></i> Upload
                </button>
                <input type="file" id="edit-avatar-file" accept="image/*" style="display:none;" />
              </div>
            </div>

            <!-- Cover Image Upload Section -->
            <div class="form-group" style="margin-bottom:1.25rem;">
              <label style="font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                <span><i class="fa-solid fa-image" style="color:var(--secondary);"></i> Cover Banner Photo</span>
                <span style="font-size:0.75rem;color:var(--text-muted);">High Resolution</span>
              </label>
              <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
                <input type="url" id="edit-cover" class="form-control" placeholder="Image URL or upload file below..." style="flex:1;min-width:180px;" />
                <button type="button" class="btn btn-outline btn-sm" id="trigger-cover-upload" style="white-space:nowrap;font-weight:700;">
                  <i class="fa-solid fa-upload"></i> Upload
                </button>
                <input type="file" id="edit-cover-file" accept="image/*" style="display:none;" />
              </div>
            </div>
            
            <div class="form-group" style="margin-bottom:1rem;">
              <label for="edit-location" style="font-weight:700;">Location</label>
              <input type="text" id="edit-location" class="form-control" placeholder="San Francisco, CA" />
            </div>
            
            <div class="form-group" style="margin-bottom:1rem;">
              <label for="edit-website" style="font-weight:700;">Website</label>
              <input type="url" id="edit-website" class="form-control" placeholder="https://yourwebsite.com" />
            </div>
            
            <div id="edit-error" class="alert alert-error hidden"></div>
            
            <div class="modal-footer" style="display:flex;gap:10px;justify-content:flex-end;margin-top:1.5rem;">
              <button type="button" class="btn btn-outline btn-sm" id="cancel-edit-btn">Cancel</button>
              <button type="submit" class="btn btn-primary btn-sm" id="save-profile-btn">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    
    <!-- Profile Navigation Tabs -->
    <div class="profile-tabs card" role="tablist">
      <button class="tab-btn active" id="tab-posts" role="tab" aria-selected="true">
        <i class="fa-solid fa-newspaper"></i> Posts
      </button>
      <button class="tab-btn" id="tab-liked" role="tab" aria-selected="false">
        <i class="fa-solid fa-heart"></i> Liked
      </button>
      <button class="tab-btn" id="tab-media" role="tab" aria-selected="false">
        <i class="fa-solid fa-image"></i> Media
      </button>
    </div>
    
    <!-- Posts Container -->
    <div id="user-posts-container" class="posts-list">
      <div class="loading-spinner" style="text-align:center;padding:2.5rem;">
        <i class="fa-solid fa-spinner fa-spin"></i> Loading user content...
      </div>
    </div>
  </main>

  <!-- ===== MODALS ===== -->
  
  <!-- Follow Modal -->
  <div id="follow-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="follow-modal-title">
    <div class="modal-overlay"></div>
    <div class="modal-content" style="max-width:440px;">
      <div class="modal-header">
        <h3 id="follow-modal-title">Followers</h3>
        <button class="modal-close" id="close-follow-modal" aria-label="Close modal">&times;</button>
      </div>
      <div id="follow-modal-list" style="max-height:420px;overflow-y:auto;padding:0.75rem;"></div>
    </div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div id="toast-container" role="alert" aria-live="polite"></div>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
