<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConnectClips — Short Vertical Videos | ⚡ ConnectHub</title>
  <meta name="description" content="Watch trending vertical short videos, discover creators, and engage in real-time on ConnectHub." />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="js/config.js"></script>
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.add('ready');
    })();
  </script>

  <!-- Global Stylesheet & Clips Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/clips.css" />
</head>
<body class="clips-page" data-theme="dark">

  <!-- Main Navbar -->
  <header class="navbar" role="navigation" aria-label="Main navigation">
    <a href="feed.html" class="nav-logo" aria-label="ConnectHub Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="var(--primary)">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 14s1.5 2 4 2 4-2 4-2" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <line x1="9" y1="9" x2="9.01" y2="9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="15" y1="9" x2="15.01" y2="9" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span>ConnectHub</span>
    </a>

    <div class="nav-search" role="search">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Search people..." 
        autocomplete="off"
        aria-label="Search users"
      />
      <div id="search-results" class="search-dropdown hidden" role="listbox"></div>
    </div>

    <div class="nav-actions">
      <!-- Feed -->
      <a href="feed.html" class="nav-icon-btn" title="Feed" aria-label="Feed">
        <i class="fa-solid fa-house"></i>
      </a>

      <!-- Clips (active) -->
      <a href="clips.html" class="nav-icon-btn active" title="ConnectClips ⚡" aria-label="ConnectClips ⚡">
        <i class="fa-solid fa-play"></i>
      </a>
      
      <!-- Explore -->
      <a href="explore.html" class="nav-icon-btn" title="Explore" aria-label="Explore">
        <i class="fa-solid fa-compass"></i>
      </a>
      
      <!-- Messages -->
      <a href="messages.html" class="nav-icon-btn" id="msg-link" title="Messages" aria-label="Messages" style="position:relative;">
        <i class="fa-solid fa-paper-plane"></i>
        <span class="msg-badge hidden" id="msg-badge"></span>
      </a>
      
      <!-- Bookmarks -->
      <a href="bookmarks.html" class="nav-icon-btn" title="Bookmarks" aria-label="Bookmarks">
        <i class="fa-solid fa-bookmark"></i>
      </a>
      
      <!-- Profile -->
      <a href="profile.html" class="nav-icon-btn" id="profile-link" title="Profile" aria-label="Profile">
        <i class="fa-solid fa-user"></i>
      </a>
      
      <!-- Notifications -->
      <button class="nav-icon-btn" id="notif-btn" title="Notifications" aria-label="Notifications" style="position:relative;">
        <i class="fa-solid fa-bell"></i>
        <span class="notif-badge hidden" id="notif-badge"></span>
      </button>
      
      <!-- Theme Toggle -->
      <button class="nav-icon-btn theme-btn" id="theme-btn" title="Toggle dark mode" aria-label="Toggle theme">
        <i class="fa-solid fa-moon" id="theme-icon"></i>
      </button>
      
      <!-- Logout -->
      <button class="nav-icon-btn logout-btn" id="logout-btn" title="Logout" aria-label="Logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <!-- Vertical Video Feed Container -->
  <main class="clips-container" id="clips-container">
    <!-- Clips rendered dynamically by clips.js -->
  </main>

  <!-- Comments Modal Drawer -->
  <div class="clip-comments-modal" id="clips-comments-modal">
    <div class="clip-comments-header">
      <span>Comments</span>
      <button class="clip-comments-close" onclick="closeComments()" aria-label="Close Comments">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="clip-comments-list" id="clips-comments-list">
      <!-- Dynamic comments -->
    </div>
    <div class="clip-comments-input-row">
      <input type="text" id="clips-comment-input" placeholder="Add a comment on ConnectHub..." onkeypress="if(event.key==='Enter') postClipComment()" />
      <button onclick="postClipComment()" aria-label="Send Comment">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JS Dependencies -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/clips.js"></script>

</body>
</html>
